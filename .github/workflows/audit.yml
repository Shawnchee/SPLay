name: "Smart Contract Audit"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: "Security Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Shawnchee/the-auditor@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}